[package]
name = "launchpad"
version = "0.0.0"
description = "Minimal launchpad showing a two-instruction graduation with anchor-raydium-cpmm"
edition.workspace = true
rust-version.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "lib"]

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []
devnet = ["anchor-raydium-cpmm/devnet"]

[dependencies]
anchor-lang = "1.2.1"
anchor-spl = { version = "1.2.1", default-features = false, features = ["associated_token", "token", "token_2022", "solana-v3"] }
anchor-raydium-cpmm = { path = "../.." }

[dev-dependencies]
litesvm = "0.10.0"
solana-message = "3.0.1"
solana-transaction = "3.0.2"
solana-signer = "3.0.0"
solana-keypair = "3.0.1"
solana-account = "3"
base64 = "0.22"
serde_json = "1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
