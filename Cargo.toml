[package]
name = "anchor-raydium-cpmm"
version = "0.1.0"
description = "Graduate a token from an Anchor program into a Raydium CPMM pool and lock the liquidity"
authors = ["Kevin Fransman"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/KevinGod1234/anchor-raydium-cpmm"
readme = "README.crates-io.md"
keywords = ["solana", "anchor", "raydium", "launchpad", "amm"]
categories = ["cryptography::cryptocurrencies"]
edition.workspace = true
rust-version.workspace = true
autoexamples = false
include = ["src/**", "README.crates-io.md", "LICENSE-*"]

[features]
# Use Raydium's devnet addresses instead of mainnet.
devnet = []

[dependencies]
anchor-lang = "1.2.1"
anchor-spl = { version = "1.2.1", default-features = false, features = ["associated_token", "token", "token_2022", "solana-v3"] }

[workspace]
members = [".", "examples/launchpad", "examples/launchpad/tests/forwarder"]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.89.0"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1
[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
